  </g>
  <g id="text_21">
   <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #617580" x="75.6" y="463.634002" transform="rotate(-0 75.6 463.634002)">仅为描述性差值；未进行显著性检验，不能据此确认渠道优劣。</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9.2px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #617580" x="55.44" y="506.40065" transform="rotate(-0 55.44 506.40065)">标准化只改变汇总权重，没有新增线索或签约；同一月份在三个来源中使用相同权重。</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9.2px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #617580" x="55.44" y="520.08065" transform="rotate(-0 55.44 520.08065)">来源：本地05方案；共同月份按分母选择。月份构成调整不等于统一随访，也不等于因果识别。</text>
  </g>
